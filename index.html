                        q: "Шеңберге сырттай сызылған трапецияның орта сызығы 15 см. Оның периметрін табыңыз.",
                        a: "Орта сызық m = (a + b) / 2 = 15 => табандарының қосындысы a + b = 30 см. Шеңберге сырттай сызылған төртбұрыштың қасиеті бойынша, табандарының қосындысы бүйір қабырғаларының қосындысына тең (a + b = c + d). Демек, c + d = 30 см. Толық периметр P = (a + b) + (c + d) = 30 + 30 = 60 см."
                    }
                ],
                quiz: [
                    {
                        question: "Табандары 7 см және 13 см, ал биіктігі 6 см болатын трапецияның ауданын табыңыз.",
                        options: ["60 см²", "120 см²", "40 см²", "30 см²"],
                        correct: 0,
                        explain: "S = ((7 + 13) / 2) * 6 = (20 / 2) * 6 = 10 * 6 = 60 см²."
                    }
                ]
            },
            polygons: {
                title: "7. Кездейсоқ көпбұрыштар",
                pageInfo: "35-36 беттер",
                theory: `
                    <p class="mb-4 text-gray-600 leading-relaxed"><strong>Дөңес n-бұрыш</strong> — кез келген қабырғасының созындысы фигураны қиып өтпейтін, n төбесі бар көпбұрыш.</p>
                    <div class="math-block p-4 rounded-xl mb-4">
                        <h4 class="font-semibold text-indigo-900 mb-2">Теоремалар мен заңдылықтар:</h4>
                        <ul class="list-disc list-inside space-y-2 text-sm">
                            <li>Кез келген дөңес n-бұрыштың ішкі бұрыштарының қосындысы келесі формуламен есептеледі: <span class="formula">∑ = (n - 2) * 180°</span></li>
                            <li>Кез келген дөңес көпбұрыштың әр төбесінен бір-бірден алынған сыртқы бұрыштарының қосындысы әрқашан <span class="formula">360°</span>-қа тең.</li>
                            <li>Бір төбеден шығатын диагональдар саны: <span class="formula">n - 3</span></li>
                            <li>Барлық диагональдарының толық саны: <span class="formula">N = (n * (n - 3)) / 2</span></li>
                        </ul>
                    </div>
                `,
                examples: [
                    {
                        q: "Бұрыштарының қосындысы 900° болатын дөңес көпбұрыштың қабырғалар санын табыңыз.",
                        a: "Формула бойынша: (n - 2) * 180° = 900° => n - 2 = 900 / 180 => n - 2 = 5 => n = 7. Бұл — жетібұрыш."
                    }
                ],
                quiz: [
                    {
                        question: "Дөңес сегізбұрыштың ішкі бұрыштарының қосындысы нешеге тең?",
                        options: ["1080°", "1440°", "900°", "720°"],
                        correct: 0,
                        explain: "Формулаға қоямыз (n=8): (8 - 2) * 180° = 6 * 180° = 1080°."
                    },
                    {
                        question: "Онбұрыштың барлық диагональдарының санын анықтаңыз.",
                        options: ["35", "45", "20", "50"],
                        correct: 0,
                        explain: "Диагональдар санының формуласы: N = (n * (n - 3)) / 2. n = 10 үшін: N = (10 * 7) / 2 = 70 / 2 = 35."
                    }
                ]
            }
        };

        // Render Sidebar Navigation Menu Dynamically
        const menuContainer = document.getElementById('topic-menu');
        Object.keys(geometryDatabase).forEach((key, index) => {
            const topic = geometryDatabase[key];
            const btn = document.createElement('button');
            btn.className = `w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 flex items-center justify-between group ${index === 0 ? 'bg-indigo-50 text-indigo-700' : 'text-gray-600 hover:bg-gray-50'}`;
            btn.id = `btn-${key}`;
            btn.onclick = () => loadTopic(key);
            btn.innerHTML = `
                <span class="truncate">${topic.title}</span>
                <span class="text-[10px] bg-white text-gray-400 group-hover:text-indigo-600 border border-gray-100 px-1.5 py-0.5 rounded">${topic.pageInfo}</span>
            `;
            menuContainer.appendChild(btn);
        });

        // Function to active topic rendering
        function loadTopic(key) {
            // Update Navigation Menu Visual Styles
            Object.keys(geometryDatabase).forEach(k => {
                const el = document.getElementById(`btn-${k}`);
                if(k === key) {
                    el.className = "w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 flex items-center justify-between bg-indigo-600 text-white shadow-sm";
                } else {
                    el.className = "w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 flex items-center justify-between text-gray-600 hover:bg-gray-50 group";
                }
            });

            const topic = geometryDatabase[key];
            const container = document.getElementById('content-container');
            
            // Build structure with tabs/sections
            let html = `
                <div class="mb-6 pb-4 border-b border-gray-100 flex justify-between items-end">
                    <div>
                        <span class="text-xs font-bold uppercase text-indigo-600 tracking-wider">Ағымдағы тақырып</span>
                        <h2 class="text-2xl font-bold text-gray-950">${topic.title}</h2>
                    </div>
                    <span class="text-sm font-semibold text-gray-400">Оқулық беті: ${topic.pageInfo}</span>
                </div>
                
                <section class="mb-8">
                    <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center">
                        <span class="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-md flex items-center justify-center text-xs mr-2">I</span> 
                        Теориялық материал
                    </h3>
                    <div class="bg-white border border-gray-100 rounded-xl p-5 shadow-xs">
                        ${topic.theory}
                    </div>
                </section>

                <section class="mb-8">
                    <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center">
                        <span class="bg-emerald-100 text-emerald-700 w-6 h-6 rounded-md flex items-center justify-center text-xs mr-2">II</span> 
                        Мысал есептер (Шығарылу жолымен)
                    </h3>
                    <div class="space-y-4">
            `;

            topic.examples.forEach((ex, i) => {
                html += `
                    <div class="bg-emerald-50/40 border border-emerald-100 rounded-xl p-5">
                        <h4 class="font-semibold text-emerald-950 mb-2">Есеп №${i+1}: ${ex.q}</h4>
                        <div class="text-sm text-gray-700 bg-white p-3 rounded-lg border border-emerald-50">
                            <strong class="text-emerald-700">Шешімі:</strong> ${ex.a}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </section>

                <section class="mb-4">
                    <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center">
                        <span class="bg-amber-100 text-amber-700 w-6 h-6 rounded-md flex items-center justify-center text-xs mr-2">III</span> 
                        Интерактивті тест жұмысы
                    </h3>
                    <p class="text-xs text-gray-400 mb-4">Жауап нұсқаларының бірін таңдаңыз. Жүйе дұрыстығын бірден тексереді.</p>
                    <div class="space-y-6">
            `;

            topic.quiz.forEach((q, qIdx) => {
                html += `
                    <div class="bg-gray-50 rounded-xl p-5 border border-gray-200" id="quiz-block-${qIdx}">
                        <p class="font-medium text-gray-900 mb-3"><span class="text-indigo-600 font-bold">Сұрақ ${qIdx+1}:</span> ${q.question}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                `;

                q.options.forEach((opt, oIdx) => {
                    html += `
                        <button onclick="checkAnswer('${key}', ${qIdx}, ${oIdx})" 
                                id="opt-${qIdx}-${oIdx}" 
                                class="w-full text-left px-4 py-3 bg-white border border-gray-200 hover:border-indigo-300 hover:bg-indigo-50/20 rounded-xl text-sm transition-all duration-150 cursor-pointer flex items-center justify-between">
                            <span>${opt}</span>
                            <span class="status-icon hidden font-bold"></span>
                        </button>
                    `;
                });

                html += `
                        </div>
                        <div id="explain-${qIdx}" class="hidden mt-4 p-3 bg-indigo-50 text-indigo-900 rounded-lg text-xs leading-relaxed border border-indigo-100">
                            <strong>Математикалық талдау:</strong> ${q.explain}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </section>
            `;

            container.innerHTML = html;
        }

        // Logic to validate selected quiz option
        function checkAnswer(topicKey, qIdx, selectedIdx) {
            const quiz = geometryDatabase[topicKey].quiz[qIdx];
            const correctIdx = quiz.correct;

            // Disable all options in this specific question group to prevent multi-clicking
            quiz.options.forEach((_, oIdx) => {
                const btn = document.getElementById(`opt-${qIdx}-${oIdx}`);
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50/20', 'cursor-pointer');
                
                // Highlight the correct option in Green anyway
                if (oIdx === correctIdx) {
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'font-medium');
                    const icon = btn.querySelector('.status-icon');
                    icon.innerHTML = "✓ Дұрыс";
                    icon.classList.remove('hidden');
                    icon.classList.add('text-emerald-600');
                }
            });

            // If selected was incorrect, highlight it in Red
            if (selectedIdx !== correctIdx) {
                const wrongBtn = document.getElementById(`opt-${qIdx}-${selectedIdx}`);
                wrongBtn.classList.add('bg-red-50', 'border-red-400', 'text-red-900');
                const icon = wrongBtn.querySelector('.status-icon');
                icon.innerHTML = "✗ Қате";
                icon.classList.remove('hidden');
                icon.classList.add('text-red-500');
            }

            // Show explanation text
            const explainDiv = document.getElementById(`explain-${qIdx}`);
            explainDiv.classList.remove('hidden');
        }

        // Initially load the first topic automatically
        window.onload = () => {
            loadTopic('quadrilaterals');
        };
    </script>
</body>
</html>
